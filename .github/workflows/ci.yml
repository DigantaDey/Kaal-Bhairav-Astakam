name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint HTML, CSS & JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run lint:html

      - name: Validate CSS
        run: npm run lint:css

      - name: Check JavaScript syntax
        run: npm run lint:js

  test:
    name: Behaviour & accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Behaviour tests
        run: npm run test:behaviour

      - name: Accessibility audit
        run: npm run test:a11y
